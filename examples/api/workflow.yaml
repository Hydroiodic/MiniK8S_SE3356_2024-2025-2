kind: Workflow
metadata:
  name: "FibonacciWorkflow"
  namespace: "default"
spec:
  entryNode: "CalculateFib"
  entryParams:
    "x": 0
    "y": 1
    "i": 1
  nodes:
    CalculateFib:
      type: "func"
      funcNodeRef:
        metadata:
          name: "fibonaccifunc"
          namespace: "default"
        next: "DoCheck"
    DoCheck:
      type: "choice"
      choiceNodeRef:
        conditions:
          - name: "IfCalculateNext"
            variables: ["i"]
            expression: "i < 10"
            next: "CalculateFib"
          - name: "Done"
            variables: []
            expression: "true"
            next: ""
