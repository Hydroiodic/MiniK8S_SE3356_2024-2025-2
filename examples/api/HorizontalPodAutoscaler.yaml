kind: HorizontalPodAutoscaler
name: <hpa-name>
target:
  kind: ReplicaSet  # 或 Deployment/Pod
  name: <target-name>
minReplicas: <min>  # 最小副本数
maxReplicas: <max>  # 最大副本数
metrics:
  - type: Resource
    resource:
      name: cpu     # 必选
      target:
        type: Utilization  # 或 AverageValue
        value: 50%        # 目标利用率
  - type: Resource
    resource:
      name: memory  # 可选（或其他资源类型）
      target:
        type: Utilization
        value: 70%
behavior:           # 扩缩容策略（可选）
  scaleUp:
    policies:
      - type: Pods
        value: 1     # 每次增加 1 个 Pod
        periodSeconds: 15  # 每 15 秒触发一次
  scaleDown:
    policies:
      - type: Pods
        value: 1
        periodSeconds: 60