version: "2"
linters:
  default: standard
  enable:
    # linters
    - asasalint
    - asciicheck
    - bidichk
    - exhaustive
    - nolintlint
    # style
    - misspell
    - dupl
    - dupword
    # - funlen # 函数长度 60 行
    - goconst
    # - godot
    # - godox # 检查TODO
    - nestif
    # - revive
    - wsl
    - whitespace
    # complexity
    - exptostd
    # - errcheck
    - gocyclo
    - lll
    - unconvert
    - wastedassign
    # security
    - gosec
  settings:
    revive:
      enable-all-rules: true
