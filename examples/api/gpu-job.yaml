kind: GpuJob
metadata:
  name: job-example1
  namespace: test-job-namespace
spec:
  partition: dgx2
  nTasks: 1
  nTasksPerNode: 1
  CPUPerTask: 6
  uploadPath: "/home/ubuntu/wang/MiniK8S_SE3356_2024-2025-2/examples/testgpu"
  runCommands: [
    "module load gcc cuda",
    "nvcc matrix_add.cu -o matrix_add",
    "nvcc matrix_multiply.cu -o matrix_multiply",
    "./matrix_add",
    "./matrix_multiply",
  ]
  outputFile: "job-example1.out"
  errorFile: "job-example1.err"
  GPUNums: 1