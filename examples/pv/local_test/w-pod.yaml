kind: Pod
metadata:
  name: local-pv-write-pod
  namespace: default
spec:
  containers:
    - name: write-container
      image: busybox:latest
      command: ["sh", "-c", "echo 'Hello from Local PVC' > /usr/share/nginx/html/index.html && sleep infinity"]
      volumeMounts:
        - name: nginx-volume
          mountPath: /usr/share/nginx/html # Pod 中的挂载路径
  volumes:
    - name: nginx-volume
      persistentVolumeClaim:
        claimName: local-pvc # 使用之前创建的 PVC