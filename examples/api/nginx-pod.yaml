apiversion: v1
kind: Pod
metadata:
  name: nginx_pod3
  namespace: default
  labels:
    app: nginx
spec:
  containers:
  - name: nginx
    image: nginx:stable-alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: nginx-conf
      mountPath: /etc/nginx/conf.d
  volumes:
  - name: nginx-conf
    hostPath:
      path: /home/ubuntu/wang/MiniK8S_SE3356_2024-2025-2/assets/nginxconfig
      type: FileOrCreate
