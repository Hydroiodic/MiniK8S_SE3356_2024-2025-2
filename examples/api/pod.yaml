kind: Pod
metadata:
  name: nginx2
  namespace: default
  labels:
    app: nginx
    tier: frontend
spec:
  containers:
    - id: nginx-container
      name: nginx
      image: nginx:latest
      command: ["nginx", "-g", "daemon off;"]
      ports: [80]
      resources:
        cpu: "1"
        memory: "128Mi"
  volumes:
    - name: nginx-volume
      path: /usr/share/nginx/html