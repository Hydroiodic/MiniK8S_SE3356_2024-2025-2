kind: Pod
metadata:
  name: dns-web-example
  namespace: default
  labels:
    app: dns-web
spec:
  containers:
  - name: dns-web
    image: nginx:latest
    ports: [80]
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html
  volumes:
  - name: nginx-html
    hostPath:
      path: /tmp/dns/web
