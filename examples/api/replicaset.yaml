kind: ReplicaSet
metadata:
  name: my-replicaset
  namespace: default
  labels:
    app: myapp
spec:
  selector:
    app: myapp
  replicas: 3
  template:
    metadata:
      labels:
        app: myapp
      name: r-pod
      namespace: default
    spec:
      containers:
      - name: myapp-container
        image: nginx:latest
        ports:
        - containerPort: 80


