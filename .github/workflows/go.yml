# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install APT Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libbtrfs-dev -y

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            /root/.cache/go-build
            /root/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build -v ./...

      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      # - name: Setup Etcd
      #   run: |
      #       bash scripts/etcd/etcd.sh

      - name: Setup Network
        run: |
            docker network create --attachable=true --subnet=10.5.20.0/24  -o "com.docker.network.bridge.name"="mini-cni0" flannel 

      - uses: actions/checkout@v4
      - name: Cache APT Packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/scripts/ipvs/ipvs.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Setup IPVS
        run: |
          bash scripts/ipvs/ipvs.sh

      - name: Test with Coverage
        run: |
          sudo go test -v -coverprofile=coverage.out ./test/...
          go tool cover -html=coverage.out -o coverage.html
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  golangci-lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install APT Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libbtrfs-dev -y

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
