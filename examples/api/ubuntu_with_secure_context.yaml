kind: Pod
metadata:
  name: ubuntu
  namespace: default
  labels:
    app: ubuntu
    tier: test
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 2000
    supplementalGroups: [4000]
    supplementalGroupsPolicy: Strict
  containers:
    - id: ubuntu-container-merge
      name: ubuntu-merge
      image: ubuntu:latest
      command: ["sleep", "infinity"]
      securityContext:
        supplementalGroupsPolicy: Merge
    - id: ubuntu-container-strict
      name: ubuntu-strict
      image: ubuntu:latest
      command: ["sleep", "infinity"]
