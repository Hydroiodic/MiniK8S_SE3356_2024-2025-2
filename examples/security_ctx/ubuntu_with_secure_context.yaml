kind: Pod
metadata:
  name: security-ctx-ubuntu-example
  namespace: default
  labels:
    app: security-ctx-ubuntu-example
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 2000
    fsGroup: 3000
    supplementalGroups: [4000]
    supplementalGroupsPolicy: Strict
  containers:
    - name: ubuntu-merge
      image: ubuntu:latest
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 2000
        supplementalGroupsPolicy: Merge
      volumeMounts:
        - name: ubuntu-volume-merge
          mountPath: /home/ubuntu
    - name: ubuntu-strict
      image: ubuntu:latest
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: ubuntu-volume-strict
          mountPath: /home/ubuntu
    - name: ubuntu-test
      image: ubuntu:latest
      command: ["sleep", "infinity"]
  volumes:
    - name: ubuntu-volume-merge
      hostPath: 
        path: /tmp/ctx/ubuntu-merge
        type: Directory
    - name: ubuntu-volume-strict
      hostPath: 
        path: /tmp/ctx/ubuntu-strict
        type: Directory
