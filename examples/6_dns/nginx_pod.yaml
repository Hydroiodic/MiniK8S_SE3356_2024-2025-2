kind: Pod
metadata:
  name: dns-nginx-example
  namespace: default
  labels:
    app: dns-nginx
spec:
  containers:
  - name: dns-nginx
    image: nginx:latest
    ports: [80]
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html
  volumes:
  - name: nginx-html
    hostPath:
      path: /tmp/dns/nginx
