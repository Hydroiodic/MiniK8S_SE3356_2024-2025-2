kind: ReplicaSet
metadata:
  name: my-replicaset
  namespace: default
  labels:
    app: myapp
spec:
  selector:
    app: myapp
  replicas: 3
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp-container
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          cpu: "1"
          memory: "128Mi"
status:
  replicas: 3
  availableReplicas: 2
